<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>صنعت داده | Cyber-Craft</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; user-select: none; }
        
        body { overflow: hidden; background: #000; }

        /* ۱. فضای دسکتاپ (شبیه ویندوز) */
        .desktop {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #0a0a0f 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* نوار وظیفه (Taskbar) */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .taskbar-left { display: flex; gap: 15px; align-items: center; }
        .taskbar-icon { font-size: 20px; cursor: pointer; }
        
        .hud {
            display: flex;
            gap: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }
        .hud span { color: #00e5ff; }

        /* ۲. شخصیت بازیکن (ادمک بامزه) */
        .player {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            z-index: 50;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 2s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        .player-mining {
            animation: mine 0.3s infinite;
        }
        @keyframes mine {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-10deg); }
            75% { transform: translateX(-50%) rotate(10deg); }
        }

        /* ۳. داده‌ها (فایل‌های روی دسکتاپ) */
        .data-item {
            position: absolute;
            font-size: 28px;
            cursor: pointer;
            z-index: 40;
            transition: transform 0.2s;
            animation: popIn 0.3s ease-out;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }
        .data-item:hover { transform: scale(1.2); }
        .data-item:active { transform: scale(0.8); }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ۴. ویروس‌ها */
        .virus {
            position: absolute;
            font-size: 30px;
            z-index: 45;
            transition: all 0.5s linear;
            filter: drop-shadow(0 0 8px #ff0000);
        }
        .virus.attack {
            animation: shake 0.3s infinite;
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(2px, 2px); }
            75% { transform: translate(-2px, -2px); }
        }

        /* ۵. فروشگاه (Modal) */
        .shop-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: rgba(10, 10, 15, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 15px;
            padding: 20px;
            z-index: 200;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            direction: rtl;
        }
        .shop-modal.hidden { display: none; }
        .shop-modal h2 { color: #00e5ff; text-align: center; margin-bottom: 10px; }
        .shop-items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .shop-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .shop-item:hover { background: rgba(0, 229, 255, 0.1); border-color: #00e5ff; }
        .shop-item .icon { font-size: 30px; }
        .shop-item .cost { font-size: 12px; color: #b800ff; font-weight: bold; }
        .shop-item .desc { font-size: 10px; color: #aaa; text-align: center; margin-top: 5px; }
        .close-shop {
            background: #b800ff; color: #fff; border: none; padding: 10px; border-radius: 10px;
            font-family: inherit; font-weight: bold; cursor: pointer;
        }

        .inventory {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 90;
            direction: rtl;
        }
        .inv-item {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00e5ff;
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="desktop" id="desktop">
        <!-- محیط بازی -->
        
        <!-- شخصیت بازیکن -->
        <div class="player" id="player" onclick="mineAction()">
            <div style="position:relative;">
                <span>😊</span>
                <span style="position:absolute; top:5px; right:5px; font-size:20px; animation: eyeMove 2s infinite;">👀</span>
            </div>
            <div style="font-size: 20px; margin-top: -10px;">❤️🗡️</div> <!-- تبر قلبی شکل -->
        </div>

        <!-- نوار وظیفه (Taskbar) -->
        <div class="taskbar">
            <div class="taskbar-left">
                <span class="taskbar-icon">🪟</span>
                <span class="taskbar-icon" onclick="toggleShop()" title="فروشگاه">🛒</span>
            </div>
            <div class="hud">
                <div>امتیاز: <span id="score">0</span></div>
                <div>مرحله: <span id="level">1</span></div>
                <div>هدف: <span id="target">4</span></div>
            </div>
            <div class="taskbar-left">
                <span class="taskbar-icon" id="timerDisplay">⏳ 60</span>
            </div>
        </div>

        <!-- موجودی کوله پشتی -->
        <div class="inventory" id="inventory"></div>

        <!-- فروشگاه -->
        <div class="shop-modal hidden" id="shopModal">
            <h2>🛒 فروشگاه مکانیزم دفاعی</h2>
            <div class="shop-items" id="shopItemsContainer">
                <!-- آیتم‌ها با جاوا اسکریپت پر میشن -->
            </div>
            <button class="close-shop" onclick="toggleShop()">بستن</button>
        </div>
    </div>

    <script>
        // --- متغیرهای بازی ---
        const desktop = document.getElementById('desktop');
        const playerEl = document.getElementById('player');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const targetEl = document.getElementById('target');
        const timerDisplay = document.getElementById('timerDisplay');
        const inventoryEl = document.getElementById('inventory');
        const shopModal = document.getElementById('shopModal');
        const shopItemsContainer = document.getElementById('shopItemsContainer');

        let score = 0;
        let level = 1;
        let targetScore = 4;
        let isShopOpen = false;
        let gameActive = true;
        let dataItems = [];
        let viruses = [];
        
        // موجودی کوله پشتی (مکانیزم‌های دفاعی)
        let inventory = {}; 

        // --- تعریف داده‌ها ---
        const dataTypes = [
            // نوع اول: ایموجی‌های ساده (۱ تا ۶ امتیاز)
            { icon: '1️⃣', points: 1, type: 'normal' },
            { icon: '2️⃣', points: 2, type: 'normal' },
            { icon: '3️⃣', points: 3, type: 'normal' },
            { icon: '4️⃣', points: 4, type: 'normal' },
            { icon: '5️⃣', points: 5, type: 'normal' },
            { icon: '6️⃣', points: 6, type: 'normal' },
            // نوع دوم: نرم‌افزارها (۶ تا ۱۰ امتیاز)
            { icon: '📄', points: 6, type: 'software' },
            { icon: '📊', points: 7, type: 'software' },
            { icon: '📽️', points: 8, type: 'software' },
            { icon: '🐍', points: 9, type: 'software' },
            { icon: '🤖', points: 10, type: 'software' }
        ];

        // --- تعریف آیتم‌های فروشگاه ---
        const shopItems = [
            // ردیف ۱: ۲ امتیاز، دفاع در برابر ۱ ویروس
            { icon: '👊', cost: 2, defense: 1 },
            { icon: '💊', cost: 2, defense: 1 },
            // ردیف ۲: ۴ امتیاز، دفاع در برابر ۳ ویروس
            { icon: '🗿', cost: 4, defense: 3 },
            { icon: '🚽', cost: 4, defense: 3 },
            { icon: '⚰️', cost: 4, defense: 3 },
            // ردیف ۳: ۶ امتیاز، دفاع در برابر ۵ ویروس
            { icon: '🩴', cost: 6, defense: 5 },
            { icon: '🩲', cost: 6, defense: 5 },
            { icon: '🔫', cost: 6, defense: 5 }
        ];

        // --- توابع اصلی ---

        // ۱. تولید داده در صفحه
        function spawnData() {
            if (!gameActive) return;

            // انتخاب تصادفی بین نوع ۱ و ۲
            const isSoftware = Math.random() < 0.5; 
            const pool = isSoftware ? dataTypes.filter(d => d.type === 'software') : dataTypes.filter(d => d.type === 'normal');
            const randomData = pool[Math.floor(Math.random() * pool.length)];

            const dataEl = document.createElement('div');
            dataEl.className = 'data-item';
            dataEl.innerText = randomData.icon;
            dataEl.dataset.points = randomData.points;

            // موقعیت تصادفی (دور از شخصیت)
            const x = Math.random() * 80 + 10; // 10% تا 90%
            const y = Math.random() * 60 + 10; // 10% تا 70%
            dataEl.style.left = `${x}%`;
            dataEl.style.top = `${y}%`;

            // کلیک برای استخراج
            dataEl.onclick = (e) => {
                e.stopPropagation();
                mineData(dataEl);
            };

            desktop.appendChild(dataEl);
            dataItems.push(dataEl);

            // ناپدید شدن بعد از ۳ تا ۵ ثانیه
            const duration = Math.floor(Math.random() * 2000) + 3000;
            setTimeout(() => {
                if (dataEl.parentNode) {
                    dataEl.style.transform = 'scale(0)';
                    setTimeout(() => {
                        if (dataEl.parentNode) dataEl.remove();
                        dataItems = dataItems.filter(d => d !== dataEl);
                    }, 300);
                }
            }, duration);

            // تایمر برای تولید بعدی
            updateTimer();
        }

        // ۲. استخراج داده
        function mineData(element) {
            if (!gameActive || isShopOpen) return;
            
            // انیمیشن شخصیت
            playerEl.classList.add('player-mining');
            setTimeout(() => playerEl.classList.remove('player-mining'), 300);

            const points = parseInt(element.dataset.points);
            score += points;
            scoreEl.innerText = score;

            // افکت بصری
            element.style.transform = 'scale(0)';
            setTimeout(() => {
                if (element.parentNode) element.remove();
                dataItems = dataItems.filter(d => d !== element);
            }, 200);

            checkLevelUp();
        }

        // ۳. بررسی ارتقاء سطح
        function checkLevelUp() {
            if (score >= targetScore) {
                level++;
                levelEl.innerText = level;
                // هر مرحله ۲ تا به هدف اضافه میشه
                targetScore += 2; 
                targetEl.innerText = targetScore;
                alert(`🎉 تبریک! به مرحله ${level} رسیدی! حالا باید ${targetScore} امتیاز جمع کنی.`);
                
                // مرحله ۲ به بعد، ویروس‌ها حمله می‌کنن
                if (level >= 2) {
                    startVirusAttack();
                }
            }
        }

        // ۴. حمله ویروس‌ها (مرحله ۲ به بعد)
        function startVirusAttack() {
            setInterval(() => {
                if (!gameActive) return;
                const virusEl = document.createElement('div');
                virusEl.className = 'virus';
                virusEl.innerText = '🦠';
                
                // شروع از لبه صفحه
                const side = Math.floor(Math.random() * 4);
                let startX, startY;
                if (side === 0) { startX = Math.random() * 100; startY = -10; }
                else if (side === 1) { startX = 110; startY = Math.random() * 100; }
                else if (side === 2) { startX = Math.random() * 100; startY = 110; }
                else { startX = -10; startY = Math.random() * 100; }

                virusEl.style.left = `${startX}%`;
                virusEl.style.top = `${startY}%`;
                desktop.appendChild(virusEl);

                const virusObj = { el: virusEl, x: startX, y: startY };
                viruses.push(virusObj);

                // حرکت به سمت بازیکن (وسط پایین)
                moveVirusToPlayer(virusObj);

            }, 15000); // هر ۱۵ ثانیه یک ویروس جدید (برای تست)
        }

        // ۵. حرکت ویروس به سمت بازیکن
        function moveVirusToPlayer(virus) {
            const moveInterval = setInterval(() => {
                if (!gameActive || isShopOpen) return;

                const playerRect = playerEl.getBoundingClientRect();
                const desktopRect = desktop.getBoundingClientRect();
                
                // موقعیت بازیکن روی صفحه
                const targetX = 50; // درصد
                const targetY = 80; // درصد (پایین صفحه)

                // حرکت آرام
                virus.x += (targetX - virus.x) * 0.02;
                virus.y += (targetY - virus.y) * 0.02;

                virus.el.style.left = `${virus.x}%`;
                virus.el.style.top = `${virus.y}%`;

                // بررسی برخورد
                if (Math.abs(virus.x - targetX) < 5 && Math.abs(virus.y - targetY) < 5) {
                    clearInterval(moveInterval);
                    virus.el.classList.add('attack');
                    handleVirusAttack(virus);
                }
            }, 500);
        }

        // ۶. برخورد ویروس با بازیکن (دفاع)
        function handleVirusAttack(virus) {
            let defended = false;
            
            // بررسی کوله پشتی برای مکانیزم دفاعی
            for (let item in inventory) {
                if (inventory[item] > 0) {
                    // استفاده از آیتم دفاعی
                    inventory[item]--;
                    if (inventory[item] <= 0) delete inventory[item];
                    
                    updateInventoryUI();
                    defended = true;
                    break;
                }
            }

            if (defended) {
                // ویروس نابود میشه
                virus.el.style.transform = 'scale(0)';
                setTimeout(() => {
                    if (virus.el.parentNode) virus.el.remove();
                    viruses = viruses.filter(v => v !== virus);
                }, 300);
            } else {
                // بازیکن آسیب می‌بینه
                gameActive = false;
                alert("💀 ویروس به تو حمله کرد و هیچ دفاعی نداشتی! بازی تموم شد. صفحه رو رفرش کن تا دوباره شروع کنی.");
                // صفر کردن امتیاز برای شروع مجدد
                score = 0;
                level = 1;
                targetScore = 4;
                scoreEl.innerText = score;
                levelEl.innerText = level;
                targetEl.innerText = targetScore;
                gameActive = true;
                // پاک کردن ویروس‌ها
                viruses.forEach(v => v.el.remove());
                viruses = [];
            }
        }

        // ۷. به‌روزرسانی کوله پشتی
        function updateInventoryUI() {
            inventoryEl.innerHTML = '';
            for (let item in inventory) {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.innerHTML = `<span>${item}</span> <span>x${inventory[item]}</span>`;
                inventoryEl.appendChild(div);
            }
        }

        // ۸. فروشگاه
        function toggleShop() {
            isShopOpen = !isShopOpen;
            shopModal.classList.toggle('hidden');
            
            if (isShopOpen) {
                renderShop();
            }
        }

        function renderShop() {
            shopItemsContainer.innerHTML = '';
            shopItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <span class="icon">${item.icon}</span>
                    <span class="cost">${item.cost} امتیاز</span>
                    <span class="desc">دفاع در برابر ${item.defense} ویروس</span>
                `;
                div.onclick = () => buyItem(item);
                shopItemsContainer.appendChild(div);
            });
        }

        // ۹. خرید آیتم
        function buyItem(item) {
            if (score >= item.cost) {
                score -= item.cost;
                scoreEl.innerText = score;
                
                // اضافه کردن به کوله پشتی
                if (!inventory[item.icon]) inventory[item.icon] = 0;
                inventory[item.icon] += item.defense; // هر آیتم چند بار دفاع میکنه
                
                updateInventoryUI();
                alert(`✅ آیتم ${item.icon} خریداری شد!`);
            } else {
                alert("❌ امتیاز کافی نداری!");
            }
        }

        // ۱۰. تایمر شمارش معکوس
        let timeLeft = 60;
        function updateTimer() {
            timeLeft = 60;
            const timerInterval = setInterval(() => {
                if (timeLeft > 0) timeLeft--;
                timerDisplay.innerText = `⏳ ${timeLeft}`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        // --- شروع بازی ---
        // اولین داده بعد از ۵ ثانیه تولید میشه (برای تست سریع)
        setTimeout(spawnData, 5000);
        
        // تولید داده هر ۶۰ ثانیه یک بار (طبق درخواست شما)
        setInterval(spawnData, 60000); 

        // شروع تایمر
        updateTimer();

        // برای اینکه کاربر بتونه با کلیک روی شخصیت هم داده استخراج کنه (اختیاری)
        function mineAction() {
            // اگر روی خود شخصیت کلیک کنی، یه انیمیشن انجام میده
            playerEl.classList.add('player-mining');
            setTimeout(() => playerEl.classList.remove('player-mining'), 300);
        }

        // استایل انیمیشن چشم
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes eyeMove {
                0%, 100% { transform: translate(0, 0); }
                25% { transform: translate(3px, 0); }
                75% { transform: translate(-3px, 0); }
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
