<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>صنعت داده | Cyber-Craft</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; user-select: none; }
        body {
            background-color: #0a0a0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0f 100%);
        }

        .game-ui {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 400px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .canvas-container {
            position: relative;
            border: 3px solid #b800ff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(184, 0, 255, 0.4);
            background: #000;
        }

        canvas {
            display: block;
            border-radius: 7px;
            cursor: crosshair;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .btn {
            background: rgba(0, 229, 255, 0.1);
            border: 2px solid #00e5ff;
            color: #00e5ff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .btn:active {
            background: #00e5ff;
            color: #000;
            transform: scale(0.95);
        }

        .btn.active {
            background: #b800ff;
            border-color: #b800ff;
            color: #fff;
            box-shadow: 0 0 15px rgba(184, 0, 255, 0.6);
        }
    </style>
</head>
<body>

    <!-- نوار وضعیت -->
    <div class="game-ui">
        <div>داده‌ها: <span id="dataCount">0</span> 💾</div>
        <div>حالت: <span id="modeText">کندن</span></div>
    </div>

    <!-- صفحه بازی -->
    <div class="canvas-container">
        <canvas id="gameCanvas" width="320" height="480"></canvas>
    </div>

    <!-- دکمه‌های کنترل -->
    <div class="controls">
        <button class="btn active" id="btnMine" onclick="setMode('mine')">⛏️ کندن داده</button>
        <button class="btn" id="btnBuild" onclick="setMode('build')">🛡️ ساخت فایروال</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dataCountEl = document.getElementById('dataCount');
        const modeTextEl = document.getElementById('modeText');

        const TILE_SIZE = 32;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        // تعریف انواع بلوک‌ها
        const BLOCK = {
            EMPTY: 0,
            DATA: 1,    // بلوک داده (منبع)
            FIREWALL: 2 // بلوک فایروال (دیوار)
        };

        // دنیای بازی (آرایه دوبعدی)
        let grid = [];
        let player = { x: 5, y: 7 }; // موقعیت شروع هکر
        let dataCount = 0;
        let currentMode = 'mine'; // 'mine' یا 'build'

        // ساخت دنیای اولیه
        function initWorld() {
            grid = [];
            for (let y = 0; y < ROWS; y++) {
                grid[y] = [];
                for (let x = 0; x < COLS; x++) {
                    // 20% احتمال تولید بلوک داده در ابتدای بازی
                    if (Math.random() < 0.2) {
                        grid[y][x] = BLOCK.DATA;
                    } else {
                        grid[y][x] = BLOCK.EMPTY;
                    }
                }
            }
            // پاک کردن اطراف بازیکن
            grid[player.y][player.x] = BLOCK.EMPTY;
        }

        // رسم دنیا
        function drawWorld() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let block = grid[y][x];
                    let px = x * TILE_SIZE;
                    let py = y * TILE_SIZE;

                    // خطوط شبکه‌ای
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
                    ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);

                    // رسم بلوک‌ها
                    if (block === BLOCK.DATA) {
                        ctx.fillStyle = "#b800ff"; // رنگ داده (بنفش نئونی)
                        ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        // افکت درخشش
                        ctx.shadowColor = "#b800ff";
                        ctx.shadowBlur = 10;
                        ctx.fillRect(px + 10, py + 10, TILE_SIZE - 20, TILE_SIZE - 20);
                        ctx.shadowBlur = 0; // ریست کردن سایه
                    } else if (block === BLOCK.FIREWALL) {
                        ctx.fillStyle = "#00e5ff"; // رنگ فایروال (آبی نئونی)
                        ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                        // خطوط روی فایروال
                        ctx.strokeStyle = "#fff";
                        ctx.strokeRect(px + 8, py + 8, TILE_SIZE - 16, TILE_SIZE - 16);
                    }
                }
            }
        }

        // رسم بازیکن (هکر)
        function drawPlayer() {
            let px = player.x * TILE_SIZE;
            let py = player.y * TILE_SIZE;
            
            ctx.font = "24px Arial";
            ctx.fillText("😎", px + 4, py + 24); // ایموجی هکر
            
            // افکت نور دور بازیکن
            ctx.strokeStyle = "#00e5ff";
            ctx.lineWidth = 2;
            ctx.shadowColor = "#00e5ff";
            ctx.shadowBlur = 10;
            ctx.strokeRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            ctx.shadowBlur = 0;
            ctx.lineWidth = 1;
        }

        // حلقه اصلی بازی
        function gameLoop() {
            drawWorld();
            drawPlayer();
            requestAnimationFrame(gameLoop);
        }

        // تغییر حالت (کندن یا ساختن)
        function setMode(mode) {
            currentMode = mode;
            if (mode === 'mine') {
                modeTextEl.innerText = "کندن";
                document.getElementById('btnMine').classList.add('active');
                document.getElementById('btnBuild').classList.remove('active');
            } else {
                modeTextEl.innerText = "ساختن";
                document.getElementById('btnBuild').classList.add('active');
                document.getElementById('btnMine').classList.remove('active');
            }
        }

        // منطق کلیک روی صفحه
        function handleInteraction(e) {
            e.preventDefault(); // جلوگیری از زوم شدن صفحه
            
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = Math.floor((clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((clientY - rect.top) / TILE_SIZE);

            // بررسی محدوده
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

            // فاصله از بازیکن (فقط می‌تونی بلوک‌های اطرافت رو تغییر بدی)
            const dist = Math.abs(x - player.x) + Math.abs(y - player.y);
            if (dist > 2) {
                alert("باید نزدیک‌تر بری! (فقط ۲ خانه اطراف)");
                return;
            }

            if (currentMode === 'mine') {
                // کندن داده
                if (grid[y][x] === BLOCK.DATA) {
                    grid[y][x] = BLOCK.EMPTY;
                    dataCount += 1;
                    dataCountEl.innerText = dataCount;
                }
            } else if (currentMode === 'build') {
                // ساخت فایروال
                if (grid[y][x] === BLOCK.EMPTY && dataCount > 0) {
                    grid[y][x] = BLOCK.FIREWALL;
                    dataCount -= 1;
                    dataCountEl.innerText = dataCount;
                } else if (dataCount === 0) {
                    alert("داده کافی نداری! اول با حالت کندن، داده جمع کن.");
                }
            }

            // جابه‌جایی بازیکن (اگه روی خونه خالی کلیک کنی، بازیکن میره اونجا)
            if (grid[y][x] === BLOCK.EMPTY && dist === 1) {
                player.x = x;
                player.y = y;
            }
        }

        // رویدادهای لمس و کلیک
        canvas.addEventListener('click', handleInteraction);
        canvas.addEventListener('touchstart', handleInteraction);

        // شروع بازی
        initWorld();
        gameLoop();
    </script>
</body>
</html>
